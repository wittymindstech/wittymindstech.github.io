<!DOCTYPE html>
<html>
<head>
  <title>AI Automation Tool</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 40px; }
    .btn { background: #000; color: #fff; padding: 15px 25px; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h1>🚀 1-Click AI Automation Tool</h1>
  <p>Automate booking tickets, movies & API workflows instantly</p>

  <h2>💰 Price: ₹999</h2>

  <button class="btn" onclick="payNow()">Get Instant Access</button>

  <script>
    function payNow() {
      var options = {
        "key": "YOUR_RAZORPAY_KEY",
        "amount": 99900, // ₹999 in paise
        "currency": "INR",
        "name": "WittyMindsTech",
        "description": "AI Automation Tool",
        "handler": function (response) {
          // Redirect after payment
          window.location.href = "/access.html?payment_id=" + response.razorpay_payment_id;
        },
        "prefill": {
          "name": "",
          "email": ""
        },
        "theme": {
          "color": "#000"
        }
      };

      var rzp = new Razorpay(options);
      rzp.open();
    }
  </script>

</body>
</html>
